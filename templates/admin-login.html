<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TreatAnywhere</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E293B', // Slate 800 for Admin distinctiveness
                        secondary: '#475569',
                        textMain: '#0F172A',
                        textMuted: '#64748B',
                        bgLight: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 10px 40px -10px rgba(0,0,0,0.06)',
                        'glow': '0 20px 40px -10px rgba(30, 41, 59, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-bgLight min-h-screen text-textMain selection:bg-primary selection:text-white flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-[440px]">
        
        <div class="text-center mb-8 flex flex-col items-center">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-slate-900/20">
                <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-textMain tracking-tight">TreatAnywhere Admin</h1>
            <p class="text-textMuted text-sm mt-2 font-medium">Secure Platform Administration</p>
        </div>

        <div class="bg-white rounded-3xl shadow-card border border-slate-100 p-8 sm:p-10">
            {% if error %}
            <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-xl text-sm font-medium flex items-start gap-2 mb-6">
                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-bold text-textMain mb-1.5">Admin Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <input type="email" id="email" name="email" required autocomplete="email"
                            class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-textMain text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none"
                            placeholder="admin@treatanywhere.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-bold text-textMain mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            class="block w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-textMain text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none"
                            placeholder="••••••••">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none focus:text-primary transition-colors">
                            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-glow hover:shadow-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-2 mt-4">
                    Secure Login
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-slate-400 font-medium flex items-center justify-center gap-1.5">
                <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                Protected System Area
            </div>
        </div>
        
    </main>

    <script>
        lucide.createIcons();
        
        // Show/Hide Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        togglePassword.addEventListener('click', function () {
            // Toggle type attribute
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            // Toggle icon
            if (type === 'text') {
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
