<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Sign In | TreatAnywhere</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A84FF',
                        secondary: '#2563EB',
                        textMain: '#1E293B',
                        textMuted: '#64748B',
                        bgLight: '#F7FAFC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 10px 40px -10px rgba(0,0,0,0.04)',
                        'glow': '0 20px 40px -10px rgba(10, 132, 255, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-bgLight min-h-screen text-textMain selection:bg-primary selection:text-white flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-100 py-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-center sm:justify-start">
            <a href="{{ url_for('home') }}" class="flex items-center gap-2">
                <img src="{{ url_for('static', filename='images/treatanywhere-emblem.webp') }}" alt="TreatAnywhere emblem" class="w-8 h-8 sm:w-10 sm:h-10 object-contain flex-shrink-0">
                <span class="font-extrabold text-xl tracking-tight"><span class="text-primary">Treat</span><span class="text-secondary">Anywhere</span></span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-[440px]">
            
            <div class="bg-white rounded-3xl shadow-card border border-gray-100 p-8 sm:p-10">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100">
                        <i data-lucide="building" class="w-8 h-8"></i>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-textMain tracking-tight mb-2">Hospital Sign In</h1>
                    <p class="text-textMuted text-sm">Sign in to manage your hospital account and connect with patients seeking healthcare.</p>
                </div>

                {% if error %}
                <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-xl text-sm font-medium flex items-start gap-2 mb-6">
                    <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('hospital_login') }}" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-bold text-textMain mb-1.5">Work Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="mail" class="w-5 h-5"></i>
                            </div>
                            <input type="email" id="email" name="email" required autocomplete="email"
                                class="block w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-textMain text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none"
                                placeholder="admin@hospital.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-bold text-textMain mb-1.5">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="lock" class="w-5 h-5"></i>
                            </div>
                            <input type="password" id="password" name="password" required autocomplete="current-password"
                                class="block w-full pl-10 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl text-textMain text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none"
                                placeholder="••••••••">
                            <button type="button" id="togglePassword" aria-label="Show password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none focus:text-primary transition-colors">
                                <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-glow hover:shadow-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-2 mt-4">
                        Sign In
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                    <div class="mt-4 text-center">
                        <span class="text-sm font-medium text-textMuted">Don't have an account?</span>
                        <a href="{{ url_for('hospital_register') }}" class="text-[14px] font-bold text-primary hover:text-blue-700 transition-colors ml-1">Sign Up</a>
                    </div>
                </form>
            </div>
            
        </div>
    </main>

    <script>
        lucide.createIcons();
        
        // Show/Hide Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        togglePassword.addEventListener('click', function () {
            // Toggle type attribute
            const isPassword = password.getAttribute('type') === 'password';
            password.setAttribute('type', isPassword ? 'text' : 'password');
            togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            
            // Toggle icon
            if (isPassword) {
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
