<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MediBid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["\"Plus Jakarta Sans\"", "sans-serif"] },
                    colors: {
                        primary: "#0B1D40",
                        secondary: "#0082CA",
                        bgLight: "#F8FAFC",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgLight font-sans text-primary min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 sm:px-10 h-[80px] flex items-center justify-between">
            <a href="{{ url_for('home') }}" class="flex items-center gap-3 group">
                <img src="{{ url_for('static', filename='images/treatanywhere-emblem.webp') }}" alt="TreatAnywhere emblem" class="w-8 h-8 sm:w-10 sm:h-10 object-contain flex-shrink-0">
                <span class="text-[22px] font-extrabold tracking-tight"><span class="text-primary">Treat</span><span class="text-secondary">Anywhere</span></span>
            </a>
            <div class="hidden sm:flex items-center gap-6">
                <span class="text-sm font-medium text-gray-500">Don't have an account?</span>
                <a href="{{ url_for('patient_registration_step1') }}" class="text-[14px] font-bold text-secondary hover:text-blue-800 transition-colors">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6 py-12">
        <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-[24px] shadow-sm border border-gray-100">
            <h1 class="text-[28px] font-extrabold text-primary tracking-tight mb-2 text-center">Sign In</h1>
            <p class="text-gray-500 text-center mb-8 text-[15px]">Welcome back to MediBid</p>
            
            {% if error %}
            <div class="bg-red-50 text-red-600 p-4 rounded-xl text-[14px] mb-6 border border-red-100 font-medium">
                {{ error|safe }}
            </div>
            {% endif %}

            <form action="{{ url_for('patient_login') }}" method="POST" class="flex flex-col gap-5">
                <div>
                    <label class="block text-[13px] font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com" class="w-full border border-gray-200 rounded-xl px-4 py-3.5 text-[15px] focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all placeholder-gray-400">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-[13px] font-bold text-gray-700 uppercase tracking-wide">Password</label>
                        <a href="#" class="text-[13px] font-bold text-secondary hover:text-blue-800 transition-colors">Forgot Password?</a>
                    </div>
                    <input type="password" name="password" required placeholder="Enter your password" class="w-full border border-gray-200 rounded-xl px-4 py-3.5 text-[15px] focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all placeholder-gray-400">
                </div>

                <button type="submit" class="mt-2 bg-[#2563EB] text-white font-bold py-4 rounded-xl shadow-sm hover:bg-[#1D4ED8] disabled:bg-[#CBD5E1] disabled:text-[#64748B] disabled:cursor-not-allowed hover:shadow transition-all text-[16px] active:scale-[0.98]">
                    Sign In
                </button>
            </form>
            
            <div class="mt-8 text-center sm:hidden">
                <span class="text-sm font-medium text-gray-500">Don't have an account?</span>
                <a href="{{ url_for('patient_registration_step1') }}" class="text-[14px] font-bold text-secondary hover:text-blue-800 transition-colors ml-1">Sign Up</a>
            </div>
        </div>
    </main>
</body>
</html>
