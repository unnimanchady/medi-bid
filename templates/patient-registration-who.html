<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who is this treatment for? - TreatAnywhere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["\"Plus Jakarta Sans\"", "sans-serif"] },
                    colors: {
                        primary: "#0B1D40",
                        secondary: "#0082CA",
                        bgLight: "#F8FAFC",
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-bgLight font-sans text-primary min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-white p-8 rounded-[24px] shadow-sm border border-gray-100">
        <h2 class="text-2xl font-extrabold mb-6 text-center tracking-tight">Who is this treatment request for?</h2>
        
        <form action="{{ url_for('patient_registration_who') }}" method="POST" class="flex flex-col gap-4" id="registration-form">
            
            {% if error %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-2 border border-red-200">
                {{ error }}
            </div>
            {% endif %}

            <!-- Myself Option -->
            <label class="flex items-center gap-4 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-secondary transition-colors" onclick="hideDropdown()">
                <input type="radio" name="profile_id" value="{{ self_profile.id if self_profile else 'new_self' }}" required class="w-5 h-5 text-secondary border-gray-300 focus:ring-secondary" checked>
                <div class="flex flex-col">
                    <span class="font-bold text-gray-900">Myself</span>
                    {% if self_profile %}
                    <span class="text-sm text-gray-500">Continue as {{ self_profile.first_name|title}} {{ self_profile.last_name|title}}</span>
                    {% else %}
                    <span class="text-sm text-gray-500">Create a profile for yourself</span>
                    {% endif %}
                </div>
            </label>

            <!-- Existing Other Profiles -->
            {% for profile in other_profiles %}
            <label class="flex items-center gap-4 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-secondary transition-colors" onclick="hideDropdown()">
                <input type="radio" name="profile_id" value="{{ profile.id }}" class="w-5 h-5 text-secondary border-gray-300 focus:ring-secondary">
                <div class="flex flex-col">
                    <span class="font-bold text-gray-900">{{ profile.first_name|title}} {{ profile.last_name|title}}</span>
                    <span class="text-sm text-gray-500">{{ profile.relationship_type }}</span>
                </div>
            </label>
            {% endfor %}
            
            <!-- Someone else Option -->
            <label class="flex items-start gap-4 p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-secondary transition-colors" onclick="showDropdown()">
                <input type="radio" name="profile_id" value="new_other" required class="w-5 h-5 mt-1 text-secondary border-gray-300 focus:ring-secondary" id="radio-other">
                <div class="flex flex-col w-full">
                    <span class="font-bold text-gray-900 mb-2">Someone else</span>
                    <div id="relationship-dropdown-container" class="hidden">
                        <label class="block text-sm text-gray-700 mb-1">Relationship to you</label>
                        <select name="relationship" id="relationship-select" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-1 focus:ring-secondary">
                            <option value="">Select relationship...</option>
                            <option value="Child">Child</option>
                            <option value="Spouse / Partner">Spouse / Partner</option>
                            <option value="Parent">Parent</option>
                            <option value="Sibling">Sibling</option>
                            <option value="Relative">Relative</option>
                            <option value="Friend">Friend</option>
                            <option value="Other">Other</option>
                        </select>
                        <p id="relationship-error" class="text-red-500 text-xs mt-1 hidden">Please select a relationship.</p>
                    </div>
                </div>
            </label>

            <button type="submit" class="mt-4 w-full bg-[#2563EB] text-white font-bold py-3.5 rounded-xl hover:bg-[#1D4ED8] disabled:bg-[#CBD5E1] disabled:text-[#64748B] disabled:cursor-not-allowed transition-colors">Continue</button>
        </form>
    </div>
    <script>
        lucide.createIcons();
        
        function hideDropdown() {
            document.getElementById('relationship-dropdown-container').classList.add('hidden');
            document.getElementById('relationship-select').required = false;
            document.getElementById('relationship-error').classList.add('hidden');
        }

        function showDropdown() {
            document.getElementById('relationship-dropdown-container').classList.remove('hidden');
            document.getElementById('relationship-select').required = true;
            document.getElementById('radio-other').checked = true;
        }

        // Initialize state based on which radio is selected
        document.addEventListener('DOMContentLoaded', function() {
            if (document.getElementById('radio-other').checked) {
                showDropdown();
            }
        });

        // Add front-end validation
        document.getElementById('registration-form').addEventListener('submit', function(e) {
            if (document.getElementById('radio-other').checked) {
                const select = document.getElementById('relationship-select');
                if (!select.value) {
                    e.preventDefault();
                    document.getElementById('relationship-error').classList.remove('hidden');
                } else {
                    document.getElementById('relationship-error').classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
